<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Nova 3D Stage</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #7EC850;
      }
      #stage-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
      }
      canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }
    </style>
    <script type="module" crossorigin src="./stage.js"></script>
  </head>
  <body>
    <div id="stage-container"></div>
  </body>
</html>
