<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Nova: play-based learning for ages 2-8.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Nova">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Nova</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4FB3FF">
  <style>
    html, body { margin: 0; height: 100%; background: #4FB3FF; overflow: hidden; }
    #nova-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at 70% 20%, #FFF1B8 0, rgba(255,241,184,0) 35%), linear-gradient(#4FB3FF, #FFD58A);
      font-family: system-ui, sans-serif; transition: opacity .5s ease;
    }
    #nova-splash h1 { margin: 0; font-size: 64px; color: #fff; letter-spacing: 2px; text-shadow: 0 6px 20px rgba(18,59,92,.35); }
    #nova-splash .dots { display: flex; gap: 12px; margin-top: 18px; }
    #nova-splash .dots span {
      width: 18px; height: 18px; border-radius: 50%; animation: nova-bounce 1s infinite ease-in-out;
      background: radial-gradient(circle at 35% 30%, #fff 0, #FF8A1F 45%, #D35F00 100%);
    }
    #nova-splash .dots span:nth-child(2) { animation-delay: .15s; }
    #nova-splash .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes nova-bounce { 0%, 80%, 100% { transform: translateY(0) scale(1, 1); } 40% { transform: translateY(-22px) scale(.9, 1.1); } }
    @media (prefers-reduced-motion: reduce) { #nova-splash .dots span { animation: none; } }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="nova-splash" aria-label="Loading Nova"><h1>Nova</h1><div class="dots"><span></span><span></span><span></span></div></div>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    // Load the rendering engine from this site's own canvaskit/ folder rather
    // than Google's CDN, so the web app has no third-party runtime
    // dependency and keeps working offline.
    _flutter.loader.load({
      config: { canvasKitBaseUrl: "canvaskit/" },
      onEntrypointLoaded: async function (engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine();
        await appRunner.runApp();
        const splash = document.getElementById("nova-splash");
        if (splash) { splash.style.opacity = "0"; setTimeout(() => splash.remove(), 500); }
      },
    });
  </script>
</body>
</html>
