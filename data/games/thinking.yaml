# Written with the Nova authoring helper, then maintained by hand. Every entry here is judgment-class
# (design inference) until the research task links verified evidence.
- id: game.cog.color-sort
  name_key: game.cog.color-sort.name
  age_range: [2, 4]
  primary_skills: [cognitive.sort.one-rule]
  secondary_skills: []
  objective: Put each toy in the right box.
  mechanic_id: sort-by-rule
  mechanic: One toy appears at a time; the child drags it into the box that matches it by colour (or by shape).
  evidence_basis: judgment
  evidence_refs: [ev.design.ef-games]
  difficulty:
    varied: [rule_complexity, distractors]
    anchors:
      rule_complexity: [sort by colour, sort by shape]
      distractors: [toys differ only in the sorting feature, toys also differ in another feature]
    rungs:
    - id: r1
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r2
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 1, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r3
      values: {item_complexity: 0, distractors: 1, working_memory_load: 0, rule_complexity: 1, abstraction: 0, cognitive_load: 0, independence: 0}
  scaffolding:
    hints: [The matching box wiggles., The rule is shown on the boxes (a colour splash or a shape outline).]
    adult_prompt: "Tidy up together by colour: all the red toys here, all the blue ones there."
  signals: [accuracy, hints_used, retries, error_type, completion]
  progression: {advance_parameter: param.default.advance-accuracy, retreat_parameter: param.default.retreat-accuracy}
  transfer_probes: []
  language_dependencies: []
- id: game.ef.sort-switch
  name_key: game.ef.sort-switch.name
  age_range: [4, 8]
  primary_skills: [ef.flexibility.switch-rule]
  secondary_skills: []
  objective: Sort the cards, then switch the rule.
  mechanic_id: switch-sort-rule
  mechanic: Cards show coloured shapes; the child sorts by colour, then after a cue sorts the same kind of cards by shape.
  evidence_basis: judgment
  evidence_refs: [ev.design.ef-games]
  difficulty:
    varied: [rule_complexity]
    anchors:
      rule_complexity: ['colour then shape, one switch', the rule switches back and forth, a border on each card says which rule to use]
    rungs:
    - id: r1
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r2
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 1, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r3
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 2, abstraction: 0, cognitive_load: 0, independence: 0}
  scaffolding:
    hints: [The current rule is shown as a picture above the boxes., The switch is announced with a sound and a new picture.]
    adult_prompt: Play sorting with real cards and change the rule halfway; ask what the new rule is.
  signals: [accuracy, hints_used, retries, error_type, completion]
  progression: {advance_parameter: param.default.advance-accuracy, retreat_parameter: param.default.retreat-accuracy}
  transfer_probes:
  - {id: probe.sort-switch-at-home, type: cross_game, delayed: false, skill: ef.flexibility.switch-rule, mechanic_id: physical-sort, task_ref: task.ef.sort-switch-at-home, changes: From cards on screen
      to real objects and a spoken switch., preserved: Changing to a new sorting rule on cue.}
  language_dependencies: []
- id: game.memory.peekaboo-pairs
