- id: game.ef.feed-the-fish
  name_key: game.ef.feed-the-fish.name
  age_range: [3, 8]
  primary_skills: [ef.inhibition.go-no-go]
  secondary_skills: []
  objective: Feed the fish, but not the sharks.
  mechanic_id: go-no-go
  mechanic: Fish and sharks swim past one at a time; the child taps fish to feed them and holds back on sharks.
  evidence_basis: judgment
  evidence_refs: [ev.design.ef-games]
  difficulty:
    varied: [cognitive_load, distractors]
    anchors:
      cognitive_load: [slow pace, medium pace, fast pace]
      distractors: [sharks appear 1 time in 4, sharks appear 1 time in 2]
    rungs:
    - id: r1
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r2
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 1, independence: 0}
    - id: r3
      values: {item_complexity: 0, distractors: 1, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 1, independence: 0}
    - id: r4
      values: {item_complexity: 0, distractors: 1, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 2, independence: 0}
  scaffolding:
    hints: [Sharks flash a red outline as they arrive., A calm voice says 'wait' when a shark appears.]
    adult_prompt: Play Simon says, or red light green light, and talk about how it feels to wait.
  signals: [accuracy, hints_used, retries, error_type, completion]
  progression: {advance_parameter: param.default.advance-accuracy, retreat_parameter: param.default.retreat-accuracy}
  transfer_probes:
  - {id: probe.freeze-dance, type: cross_game, delayed: false, skill: ef.inhibition.go-no-go, mechanic_id: physical-freeze, task_ref: task.ef.freeze-dance, changes: From tapping on screen to stopping the
      whole body in a dance., preserved: Acting on one signal and holding back on another.}
  language_dependencies: []
