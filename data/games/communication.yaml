- id: game.sel.calm-down
  name_key: game.sel.calm-down.name
  age_range: [3, 8]
  primary_skills: [sel.comm.self-control]
  secondary_skills: []
  objective: Find a calm way.
  mechanic_id: story-choice
  mechanic: 'The child hears about a big feeling or a hard wait; they choose a calm way (breathe, count, ask a grown-up) instead of hitting, throwing or grabbing.'
  evidence_basis: framework
  evidence_refs: [ev.sel.fujimoto-daibo-2007, ev.sel.takahashi-2008]
  difficulty:
    varied: [distractors]
    anchors:
      distractors: [two ways to choose from, three ways to choose from]
    rungs:
    - id: r1
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r2
      values: {item_complexity: 0, distractors: 1, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
  scaffolding:
    hints: ['The companion breathes slowly with the child.', 'Each way is shown with the companion trying it.']
    adult_prompt: Practise a calm-down breath together when nobody is upset, so it is ready when someone is.
  signals: [accuracy, hints_used, retries, error_type, completion]
  progression: {advance_parameter: param.default.advance-accuracy, retreat_parameter: param.default.retreat-accuracy}
  transfer_probes:
  - {id: probe.calm-down-in-life, type: cross_context, delayed: false, skill: sel.comm.self-control, mechanic_id: real-life-social, task_ref: task.sel.calm-at-home, changes: From a story on screen to the child's own everyday play., preserved: The same social choice (what to say or do) in a real moment.}
  language_dependencies: []
- id: game.sel.fair-play
  name_key: game.sel.fair-play.name
  age_range: [5, 8]
  primary_skills: [sel.comm.relationships]
  secondary_skills: []
  objective: Keep the friendship good.
  mechanic_id: story-choice
  mechanic: 'Two friends want the same thing, or have quarrelled; the child chooses what keeps the friendship good: take turns, share, make up.'
  evidence_basis: framework
  evidence_refs: [ev.sel.fujimoto-daibo-2007, ev.sel.takahashi-2008]
  difficulty:
    varied: [distractors]
    anchors:
      distractors: [two ways to choose from, three ways to choose from]
    rungs:
    - id: r1
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r2
      values: {item_complexity: 0, distractors: 1, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
  scaffolding:
    hints: ['The two friends say how each of them feels.', 'The companion asks: what would be fair for both?']
    adult_prompt: In real play, notice and praise taking turns and making up after a quarrel.
  signals: [accuracy, hints_used, retries, error_type, completion]
  progression: {advance_parameter: param.default.advance-accuracy, retreat_parameter: param.default.retreat-accuracy}
  transfer_probes:
  - {id: probe.fair-play-in-life, type: cross_context, delayed: false, skill: sel.comm.relationships, mechanic_id: real-life-social, task_ref: task.sel.turns-at-home, changes: From a story on screen to the child's own everyday play., preserved: The same social choice (what to say or do) in a real moment.}
  language_dependencies: []
