  primary_skills: [sel.comm.other-acceptance]
  secondary_skills: []
  objective: Choose a kind way to help.
  mechanic_id: story-choice
  mechanic: 'A friend feels bad or likes something different; the child chooses what would help or show respect.'
  evidence_basis: framework
  evidence_refs: [ev.sel.fujimoto-daibo-2007, ev.sel.takahashi-2008]
  difficulty:
    varied: [distractors]
    anchors:
      distractors: [two ways to choose from, three ways to choose from]
    rungs:
    - id: r1
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r2
      values: {item_complexity: 0, distractors: 1, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
  scaffolding:
    hints: ['The friend''s face is shown bigger.', 'The companion asks: how does your friend feel?']
