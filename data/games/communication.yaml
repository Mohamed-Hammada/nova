# Communication and social-skills games. Each is based on published Japanese research (the
# research rule): the ENDCORE model (Fujimoto & Daibo, 2007) for which skill it practises, and the
# preschool social-skill factors (Takahashi et al., 2008) for what that skill looks like at this age.
- id: game.sel.show-my-feeling
  name_key: game.sel.show-my-feeling.name
  age_range: [2, 5]
  primary_skills: [sel.comm.expressivity]
  secondary_skills: []
  objective: Show how you feel.
  mechanic_id: emotion-match
  mechanic: 'A short moment happens to the child ("your tower fell down"); the child picks the face that shows how they feel, as they would show a friend.'
  evidence_basis: framework
  evidence_refs: [ev.sel.fujimoto-daibo-2007, ev.sel.takahashi-2008]
  difficulty:
    varied: [distractors]
    anchors:
      distractors: [two ways to choose from, three ways to choose from]
    rungs:
    - id: r1
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r2
      values: {item_complexity: 0, distractors: 1, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
  scaffolding:
    hints: ['The moment is told again.', 'The companion shows the feeling with its whole body.']
    adult_prompt: Take turns showing a feeling with your face and body and guessing it.
  signals: [accuracy, hints_used, retries, error_type, completion]
  progression: {advance_parameter: param.default.advance-accuracy, retreat_parameter: param.default.retreat-accuracy}
  transfer_probes:
  - {id: probe.show-my-feeling-in-life, type: cross_context, delayed: false, skill: sel.comm.expressivity, mechanic_id: real-life-social, task_ref: task.sel.show-feelings, changes: From a story on screen to the child's own everyday play., preserved: The same social choice (what to say or do) in a real moment.}
  language_dependencies: []
- id: game.sel.kind-words
  name_key: game.sel.kind-words.name
  age_range: [4, 8]
  primary_skills: [sel.comm.assertion]
  secondary_skills: []
  objective: Say what you need, kindly and clearly.
  mechanic_id: story-choice
  mechanic: 'Something happens (a friend takes your crayon); the child chooses what to say: a clear, kind request, saying nothing, or grabbing and shouting.'
  evidence_basis: framework
  evidence_refs: [ev.sel.fujimoto-daibo-2007, ev.sel.takahashi-2008]
  difficulty:
    varied: [distractors]
    anchors:
      distractors: [two ways to choose from, three ways to choose from]
    rungs:
    - id: r1
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r2
      values: {item_complexity: 0, distractors: 1, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
  scaffolding:
    hints: ['Each way of answering is read aloud again.', 'The companion asks: would that tell them what you need, kindly?']
    adult_prompt: Practise asking for a turn or for help in your own words, and praise clear, kind asking.
  signals: [accuracy, hints_used, retries, error_type, completion]
  progression: {advance_parameter: param.default.advance-accuracy, retreat_parameter: param.default.retreat-accuracy}
  transfer_probes:
  - {id: probe.kind-words-in-life, type: cross_context, delayed: false, skill: sel.comm.assertion, mechanic_id: real-life-social, task_ref: task.sel.ask-kindly, changes: From a story on screen to the child's own everyday play., preserved: The same social choice (what to say or do) in a real moment.}
  language_dependencies: []
- id: game.sel.help-a-friend
