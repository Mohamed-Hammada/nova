  secondary_skills: []
  objective: Which letter does the word start with?
  mechanic_id: sound-match
  mechanic: A picture is shown and its word spoken; the child taps the letter the word starts with.
  evidence_basis: judgment
  evidence_refs: [ev.design.literacy-games]
  difficulty:
    varied: [distractors]
    anchors:
      distractors: [two letters, three letters]
    rungs:
    - id: r1
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
