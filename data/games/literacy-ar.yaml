  evidence_refs: [ev.design.literacy-games]
  difficulty:
    varied: [item_complexity, distractors]
    anchors:
      item_complexity: [short words, longer words]
      distractors: [pictures of words that look different, 'pictures of words that share letters (cat, car, cap)']
    rungs:
    - id: r1
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r2
      values: {item_complexity: 0, distractors: 1, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r3
      values: {item_complexity: 1, distractors: 1, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
  scaffolding:
    hints: [The first letter's sound is given., The word is split into parts.]
    adult_prompt: Label things at home with cards and read them together.
  signals: [accuracy, hints_used, retries, error_type, completion]
  progression: {advance_parameter: param.default.advance-accuracy, retreat_parameter: param.default.retreat-accuracy}
  transfer_probes: []
  language_dependencies: [ar]
