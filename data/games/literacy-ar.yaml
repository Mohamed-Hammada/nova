# Written with the Nova authoring helper, then maintained by hand. Every entry here is judgment-class
# (design inference) until the research task links verified evidence.
- id: game.lit.ar.listen-and-find
  name_key: game.lit.ar.listen-and-find.name
  age_range: [2, 5]
  primary_skills: [lit.ar.listening]
  secondary_skills: []
  objective: Listen to the sentence and find the picture.
  mechanic_id: story-choice
  mechanic: A short sentence or two-line story is spoken; the child taps the picture that shows what happened.
  evidence_basis: judgment
  evidence_refs: [ev.design.literacy-games]
  difficulty:
    varied: [item_complexity, distractors]
    anchors:
      item_complexity: [one simple sentence, a two-sentence story]
      distractors: [two pictures, three pictures that differ in one detail]
    rungs:
    - id: r1
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r2
      values: {item_complexity: 1, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r3
      values: {item_complexity: 1, distractors: 1, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
  scaffolding:
    hints: [The sentence can be heard again., Key words are shown with pictures.]
    adult_prompt: Read a picture book and ask the child to point to what you describe.
  signals: [accuracy, hints_used, retries, error_type, completion]
  progression: {advance_parameter: param.default.advance-accuracy, retreat_parameter: param.default.retreat-accuracy}
  transfer_probes:
  - {id: probe.ar.retell, type: cross_game, delayed: false, skill: lit.ar.listening, mechanic_id: retell, task_ref: task.lit.ar.retell, changes: From choosing pictures to retelling a real story., preserved: Understanding
      a spoken story.}
  language_dependencies: [ar]
- id: game.lit.ar.word-hunt
  name_key: game.lit.ar.word-hunt.name
  age_range: [2, 5]
  primary_skills: [lit.ar.vocabulary]
  secondary_skills: []
  objective: Find the picture of the word you hear.
  mechanic_id: hear-and-point
  mechanic: A word is spoken; the child taps its picture among several.
  evidence_basis: judgment
  evidence_refs: [ev.design.literacy-games]
  difficulty:
    varied: [item_complexity, distractors]
    anchors:
      item_complexity: ['very common words (ball, cup)', 'less common words (shell, kite)']
      distractors: [two pictures, four pictures]
    rungs:
    - id: r1
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r2
      values: {item_complexity: 0, distractors: 1, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r3
      values: {item_complexity: 1, distractors: 1, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
  scaffolding:
    hints: [The word is repeated slowly., The picture wiggles after a pause.]
    adult_prompt: Name things around the house and ask the child to point to them.
  signals: [accuracy, hints_used, retries, error_type, completion]
  progression: {advance_parameter: param.default.advance-accuracy, retreat_parameter: param.default.retreat-accuracy}
  transfer_probes:
  - {id: probe.ar.find-what-i-name, type: cross_game, delayed: false, skill: lit.ar.vocabulary, mechanic_id: physical-hunt, task_ref: task.lit.ar.find-what-i-name, changes: From pictures to real things
      at home., preserved: Knowing the word for a thing.}
  language_dependencies: [ar]
- id: game.lit.ar.clap-syllables
  name_key: game.lit.ar.clap-syllables.name
  age_range: [3, 5]
  primary_skills: [lit.ar.syllables]
  secondary_skills: []
  objective: Clap once for each part of the word.
  mechanic_id: segment-sounds
  mechanic: A word is spoken with its picture; the child taps the drum once for each syllable.
  evidence_basis: judgment
  evidence_refs: [ev.design.literacy-games]
  difficulty:
    varied: [item_complexity]
    anchors:
      item_complexity: [one- and two-syllable words, two- and three-syllable words, words of up to four syllables]
    rungs:
    - id: r1
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r2
      values: {item_complexity: 1, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r3
      values: {item_complexity: 2, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
  scaffolding:
    hints: [The word is said with pauses between its parts., Dots appear for each part.]
    adult_prompt: Clap the syllables of family names together.
  signals: [accuracy, hints_used, retries, error_type, completion]
  progression: {advance_parameter: param.default.advance-accuracy, retreat_parameter: param.default.retreat-accuracy}
  transfer_probes:
  - {id: probe.ar.clap-names, type: cross_game, delayed: false, skill: lit.ar.syllables, mechanic_id: oral-sound-game, task_ref: task.lit.ar.sound-games, changes: From tapping a drum to clapping names with
      an adult., preserved: Splitting words into syllables.}
  language_dependencies: [ar]
