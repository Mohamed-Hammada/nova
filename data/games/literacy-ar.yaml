  language_dependencies: [ar]
- id: game.lit.ar.word-builder
  name_key: game.lit.ar.word-builder.name
  age_range: [5, 7]
  primary_skills: [lit.ar.build-words]
  secondary_skills: []
  objective: Build the word for the picture.
  mechanic_id: build-word
  mechanic: A picture is shown and its word spoken; the child drags letter tiles into the slots in order.
  evidence_basis: judgment
  evidence_refs: [ev.design.literacy-games]
  difficulty:
    varied: [item_complexity, distractors]
    anchors:
      item_complexity: [three-letter words, four-letter words]
      distractors: [only the needed tiles, one extra tile]
    rungs:
    - id: r1
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r2
      values: {item_complexity: 0, distractors: 1, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r3
      values: {item_complexity: 1, distractors: 1, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
  scaffolding:
    hints: [The next letter's sound is spoken., The first letter is placed for the child.]
    adult_prompt: Build a short word with magnetic letters or letter cards.
  signals: [accuracy, hints_used, retries, error_type, completion]
  progression: {advance_parameter: param.default.advance-accuracy, retreat_parameter: param.default.retreat-accuracy}
  transfer_probes:
  - {id: probe.ar.sound-blender, type: cross_game, delayed: false, skill: lit.ar.build-words, mechanic_id: blend-sounds, task_ref: game.lit.ar.sound-blender, changes: From building with tiles to hearing
      parts and choosing the word., preserved: Putting sounds together into words.}
  language_dependencies: [ar]
- id: game.lit.ar.sound-blender
  name_key: game.lit.ar.sound-blender.name
  age_range: [5, 7]
  primary_skills: [lit.ar.build-words]
  secondary_skills: []
  objective: Put the sounds together and find the word.
  mechanic_id: blend-sounds
  mechanic: A word is spoken in parts (c-a-t, or syllables); the child taps the picture of the whole word.
  evidence_basis: judgment
  evidence_refs: [ev.design.literacy-games]
  difficulty:
    varied: [item_complexity]
    anchors:
      item_complexity: [words split into syllables, short words split into sounds]
    rungs:
    - id: r1
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r2
      values: {item_complexity: 1, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
  scaffolding:
    hints: [The parts are said closer together., The first part is linked to its letter.]
    adult_prompt: Say a word in parts (sh-ip) and ask the child to say it whole.
  signals: [accuracy, hints_used, retries, error_type, completion]
  progression: {advance_parameter: param.default.advance-accuracy, retreat_parameter: param.default.retreat-accuracy}
  transfer_probes: []
  language_dependencies: [ar]
- id: game.lit.ar.word-pictures
  name_key: game.lit.ar.word-pictures.name
  age_range: [6, 8]
  primary_skills: [lit.ar.read-words]
  secondary_skills: []
  objective: Read the word and find its picture.
  mechanic_id: read-and-match
  mechanic: A short word is shown in print (not spoken); the child reads it and taps its picture.
