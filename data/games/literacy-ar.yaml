- id: game.lit.ar.book-explorer
  name_key: game.lit.ar.book-explorer.name
  age_range: [3, 5]
  primary_skills: [lit.ar.print-direction]
  secondary_skills: []
  objective: Show where the reading starts and follow the words.
  mechanic_id: print-follow
  mechanic: A page with a short line of Arabic text appears; the child taps where reading starts, then taps the words in order from right to left.
  evidence_basis: judgment
  evidence_refs: [ev.design.literacy-games]
  difficulty:
    varied: [item_complexity]
    anchors:
      item_complexity: [find where the line starts, tap the words of one line in order, 'follow two lines, top then bottom']
    rungs:
    - id: r1
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r2
      values: {item_complexity: 1, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r3
      values: {item_complexity: 2, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
  scaffolding:
    hints: [An arrow shows the reading direction., The next word glows.]
    adult_prompt: When reading together, run your finger under the words.
  signals: [accuracy, hints_used, retries, error_type, completion]
  progression: {advance_parameter: param.default.advance-accuracy, retreat_parameter: param.default.retreat-accuracy}
  transfer_probes:
  - {id: probe.ar.book-start, type: cross_game, delayed: false, skill: lit.ar.print-direction, mechanic_id: print-hunt, task_ref: task.lit.ar.book-hunt, changes: From a screen page to a real book., preserved: Knowing
      where reading starts and which way it goes.}
  language_dependencies: [ar]
- id: game.lit.ar.letter-forms
  name_key: game.lit.ar.letter-forms.name
  age_range: [4, 6]
  primary_skills: [lit.ar.letter-forms]
  secondary_skills: []
  objective: Match the letter to its joined form.
  mechanic_id: letter-match
  mechanic: A letter is shown on its own; the child taps the same letter as it looks at the start of a word.
  evidence_basis: judgment
  evidence_refs: [ev.design.literacy-games]
  difficulty:
    varied: [item_complexity, distractors]
    anchors:
      item_complexity: [letters whose joined form keeps its shape (ب ت ث ن), letters whose joined form changes more (ع غ ه ك)]
      distractors: [two choices, 'three choices, including a letter with the same body and different dots']
    rungs:
    - id: r1
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r2
      values: {item_complexity: 1, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r3
      values: {item_complexity: 1, distractors: 1, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
  scaffolding:
    hints: [The letter name is spoken., The dots of the letter are highlighted.]
    adult_prompt: Find a letter at the start of words on a food packet together.
  signals: [accuracy, hints_used, retries, error_type, completion]
  progression: {advance_parameter: param.default.advance-accuracy, retreat_parameter: param.default.retreat-accuracy}
  transfer_probes:
  - {id: probe.ar.letter-catch, type: cross_game, delayed: false, skill: lit.ar.letter-forms, mechanic_id: catch-target, task_ref: game.lit.ar.letter-catch, changes: From matching one letter to catching
      it among many moving letters., preserved: Knowing a letter in its forms.}
  - {id: probe.ar.book-letters, type: cross_game, delayed: false, skill: lit.ar.letter-forms, mechanic_id: print-hunt, task_ref: task.lit.ar.book-hunt, changes: From the screen to a real book., preserved: Recognising
      letters.}
  language_dependencies: [ar]
- id: game.lit.ar.letter-catch
  name_key: game.lit.ar.letter-catch.name
  age_range: [4, 6]
  primary_skills: [lit.ar.letter-forms]
  secondary_skills: []
  objective: Catch the bubbles with the same letter.
  mechanic_id: catch-target
  mechanic: A letter is shown; bubbles with letters float up and the child pops only the ones with the same letter, in any form.
  evidence_basis: judgment
  evidence_refs: [ev.design.literacy-games]
  difficulty:
    varied: [item_complexity, cognitive_load]
    anchors:
      item_complexity: [the separate form only, separate and joined forms]
      cognitive_load: [slow bubbles, faster bubbles]
    rungs:
    - id: r1
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r2
      values: {item_complexity: 1, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r3
      values: {item_complexity: 1, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 1, independence: 0}
  scaffolding:
    hints: [The target letter stays on screen., Matching bubbles glow briefly.]
    adult_prompt: Hunt for one letter on a sign or packet together.
  signals: [accuracy, hints_used, retries, error_type, completion]
  progression: {advance_parameter: param.default.advance-accuracy, retreat_parameter: param.default.retreat-accuracy}
  transfer_probes: []
  language_dependencies: [ar]
