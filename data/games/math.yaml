# Written with the Nova authoring helper, then maintained by hand. Every entry here is judgment-class
# (design inference) until the research task links verified evidence.
- id: game.math.bunny-carrots
  name_key: game.math.bunny-carrots.name
  age_range: [2, 3]
  primary_skills: [math.count.to-3]
  secondary_skills: []
  objective: Give the bunny exactly the carrots she asks for.
  mechanic_id: drag-to-count
  mechanic: The bunny asks for one, two or three carrots; the child drags carrots onto her plate and stops at the number asked.
  evidence_basis: judgment
  evidence_refs: [ev.design.drag-to-count-mechanic]
  difficulty:
    varied: [item_complexity, distractors]
    anchors:
      item_complexity: [requests of 1 or 2, requests of 1 to 3]
      distractors: [only carrots, carrots mixed with radishes; only carrots count]
    rungs:
    - id: r1
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r2
      values: {item_complexity: 1, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r3
      values: {item_complexity: 1, distractors: 1, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
  scaffolding:
    hints: [Each carrot glows as its number is spoken., The bunny holds up fingers for the number she wants.]
    adult_prompt: Ask the child to hand you one or two real things, then say how many you have.
  signals: [accuracy, hints_used, retries, error_type, completion]
  progression: {advance_parameter: param.default.advance-accuracy, retreat_parameter: param.default.retreat-accuracy}
  transfer_probes: []
  language_dependencies: []
- id: game.math.more-or-less
  name_key: game.math.more-or-less.name
  age_range: [3, 6]
  primary_skills: [math.compare.more-fewer]
  secondary_skills: []
  objective: Pick the basket with more (or fewer).
  mechanic_id: compare-quantities
  mechanic: Two baskets with different numbers of things appear; the child taps the one with more, or with fewer when asked.
  evidence_basis: judgment
  evidence_refs: [ev.design.choice-mechanics]
  difficulty:
    varied: [item_complexity, rule_complexity]
    anchors:
      item_complexity: [groups of 1 to 4 that differ by at least 2, groups of 1 to 6 that differ by 1 or 2, groups of up to 10 that differ by 1]
      rule_complexity: [always asks which has more, asks for more or fewer]
    rungs:
    - id: r1
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r2
      values: {item_complexity: 1, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r3
      values: {item_complexity: 1, distractors: 0, working_memory_load: 0, rule_complexity: 1, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r4
      values: {item_complexity: 2, distractors: 0, working_memory_load: 0, rule_complexity: 1, abstraction: 0, cognitive_load: 0, independence: 0}
  scaffolding:
    hints: [The objects line up in pairs so the extra ones stand out., The question is repeated with a gesture for more or fewer.]
    adult_prompt: "Ask: how did you know that basket has more? Let the child count to check."
