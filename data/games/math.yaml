- id: game.math.cherry-sums
  name_key: game.math.cherry-sums.name
  age_range: [6, 8]
  primary_skills: [math.add-sub.within-20]
  secondary_skills: [math.number.parts-of-ten]
  objective: Add past ten by making ten first (さくらんぼ計算, the Japanese cherry method).
  mechanic_id: make-ten-split
  mechanic: 'A sum like 8 + 5 is shown with the 5 split into two cherries: first the child finds the part that makes 8 up to 10 (2), then what is left (3), then the whole sum (13).'
  evidence_basis: empirical
  evidence_refs: [ev.math.murata-2004, ev.math.kullberg-2020]
  difficulty:
    varied: [item_complexity]
    anchors:
      item_complexity: [find the part that makes ten, find the part that is left, the whole sum]
    rungs:
    - id: r1
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r2
      values: {item_complexity: 1, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r3
      values: {item_complexity: 2, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
  scaffolding:
    hints: [The first cherry fills the ten-frame up to ten., The companion says the two steps aloud (8 and 2 make 10; 10 and 3 make 13).]
    adult_prompt: 'Add past ten with small objects: fill a ten first, then count what is left.'
  signals: [accuracy, hints_used, retries, error_type, completion]
  progression: {advance_parameter: param.default.advance-accuracy, retreat_parameter: param.default.retreat-accuracy}
  transfer_probes:
  - {id: probe.cherry-at-home, type: cross_game, delayed: false, skill: math.add-sub.within-20, mechanic_id: physical-counting, task_ref: task.math.add-at-home, changes: From cherries on a screen to real objects., preserved: Making ten first to add past ten.}
  language_dependencies: []
- id: game.math.tape-stories
  name_key: game.math.tape-stories.name
  age_range: [6, 8]
  primary_skills: [math.add-sub.within-10]
  secondary_skills: []
  objective: Solve a short story problem with a tape diagram (テープ図).
  mechanic_id: tape-diagram
  mechanic: 'A story problem is read aloud and drawn as a tape: two parts side by side under one whole. The child finds the missing number -- the whole first, then a missing part.'
  evidence_basis: framework
  evidence_refs: [ev.math.murata-2008]
  difficulty:
    varied: [rule_complexity]
    anchors:
      rule_complexity: [the whole is missing (put together), a part is missing (take away)]
    rungs:
    - id: r1
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r2
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 1, abstraction: 0, cognitive_load: 0, independence: 0}
  scaffolding:
    hints: [The story is read again while each part of the tape lights up., The companion points at the part of the tape that is missing.]
    adult_prompt: 'Tell a story problem at home and draw it as a strip of paper cut into two parts.'
  signals: [accuracy, hints_used, retries, error_type, completion]
  progression: {advance_parameter: param.default.advance-accuracy, retreat_parameter: param.default.retreat-accuracy}
  transfer_probes:
  - {id: probe.tape-at-home, type: cross_game, delayed: false, skill: math.add-sub.within-10, mechanic_id: physical-counting, task_ref: task.math.add-at-home, changes: From a drawn tape to real objects and a paper strip., preserved: Seeing the parts and the whole of a story problem.}
  language_dependencies: []
