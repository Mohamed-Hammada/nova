- id: game.math.make-ten
  name_key: game.math.make-ten.name
  age_range: [4, 7]
  primary_skills: [math.number.parts-of-ten]
  secondary_skills: []
  objective: Find how many more make five, or ten.
  mechanic_id: make-number
  mechanic: A five- or ten-frame shows some dots; the child chooses how many more fill it (いくつといくつ, the parts of ten), then just the numbers.
  evidence_basis: empirical
  evidence_refs: [ev.math.kullberg-2020, ev.math.murata-2004]
  difficulty:
    varied: [item_complexity, abstraction]
    anchors:
      item_complexity: [make five, make ten]
      abstraction: [dots on the frame, numbers only]
    rungs:
    - id: r1
      values: {item_complexity: 0, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r2
      values: {item_complexity: 1, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 0, cognitive_load: 0, independence: 0}
    - id: r3
      values: {item_complexity: 1, distractors: 0, working_memory_load: 0, rule_complexity: 0, abstraction: 1, cognitive_load: 0, independence: 0}
  scaffolding:
    hints: [The empty squares of the frame glow, one by one., The companion counts on from the dots to five or ten.]
    adult_prompt: 'Show seven fingers and ask: how many more make ten? Then swap.'
  signals: [accuracy, hints_used, retries, error_type, completion]
  progression: {advance_parameter: param.default.advance-accuracy, retreat_parameter: param.default.retreat-accuracy}
  transfer_probes:
