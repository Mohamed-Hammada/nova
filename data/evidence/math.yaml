# Early mathematics.
#
# Two of the three entries below are citations the original brief made and that nobody had
# checked; both were opened and both are confirmed, with precisions. The third (the National
# Research Council's consensus report on early mathematics) was added because Nova needed a
# source for the counting ordering it had been carrying as a design inference.
#
# Every entry here was checked by opening the URL recorded on it (see
# docs/curriculum/research-log.md for the verification record).

- id: ev.math.sun-2026
  title: "Early mathematics interventions in pre-primary education: A three-level meta-analysis of intentional teaching and exploratory play approaches"
  citation: Sun, J., Xie, S., Li, J.-B., Li, J., & Mu, F. (2026). Educational Research Review, 52, 100830. doi:10.1016/j.edurev.2026.100830
  url: https://doi.org/10.1016/j.edurev.2026.100830
  verified: true
  evidence_type: meta_analysis
  evidence_strength: emerging
  population: preschool and kindergarten children in 74 studies published 2000-2025, classified by dominant pedagogical emphasis as intentional teaching (k = 56) or exploratory play (k = 18), yielding 566 effect sizes; the abstract states no age band and names no countries
  delivery: mixed
  language: unstated
  finding: >-
    Both pedagogical approaches were associated with positive effects on children's learning, and
    the difference between them was not statistically significant: intentional teaching g = 0.32,
    exploratory play g = 0.21. Within intentional teaching, effects were larger for advanced
    numeracy outcomes (quantitative comparison g = 0.42; calculation g = 0.45) than for
    foundational number and counting skills (g = 0.21). Effects attenuated over time - post-test
    g = 0.34 versus follow-up g = 0.20 - which the authors call partial fadeout. Within exploratory
    play, interventions using contextual scenarios were much more effective (g = 0.47) than those
    without (g = 0.13), and effects were present for maths-specific outcomes (g = 0.26) but absent
    for non-maths outcomes (g = -0.01). For Nova this is the best available support for the claim
    that a playful, goal-carrying maths activity can produce learning, and it is also a warning:
    the effect on exactly the skills Nova's counting slice targets is the smallest one reported.
  limits: >-
    Abstract only; full text not read. ScienceDirect returned HTTP 403 to every automated request,
    including for the open-access CC BY-NC-ND PDF, so the methods, the list of included studies,
    the heterogeneity statistics, the risk-of-bias appraisal and the authors' own limitations
    section were NOT read, nothing beyond the publisher-deposited abstract is recorded here, and
    the quality of the meta-analysis cannot be judged - which is why this entry is rated
    'emerging' despite its size. The effects are small to moderate and they fade. The abstract does
    not state the delivery mode of the included interventions, the children's ages, the countries
    or the languages of instruction, so none of that is claimed and `delivery` is recorded as
    'mixed' rather than inferred from the pre-primary setting. The finding that exploratory play only worked with
    contextual scenarios, and did not move non-maths outcomes at all, is a direct argument against
    assuming any spillover from a maths game to other domains.

- id: ev.math.munez-2026
  title: A Systematic Review of Mathematics Interventions for Preschoolers
  citation: "Mu\xF1ez, D., Cheung, P., Lim, M., & Tang, N. (2026). Educational Studies in Mathematics, 122(3), 451-486. doi:10.1007/s10649-026-10490-9"
  url: https://eric.ed.gov/?id=EJ1510312
  verified: true
  evidence_type: systematic_review
  evidence_strength: emerging
  population: 101 mathematics interventions for preschool-aged children (3-6 years) conducted across 25 countries over the past 25 years; half of the studies targeted children from low-SES backgrounds
  delivery: mixed
  language: multi
  finding: >-
    Over 90% of the studies reported positive outcomes. But the review's central finding is about
    the shape of those gains: "gains were predominantly characterized by near-transfer to trained
    skills. Transfer to broader, more general mathematical abilities or untrained skills was not
    frequent. In fact, only 7% of the studies demonstrated far-transfer effects, and these yielded
    small effect sizes." Just over a third of studies included long-term follow-up, so "the
    sustainability of intervention effects remains largely unknown, making the documented
    'fade-out' effect a persistent concern". The review also reports that a substantial proportion
    of studies had only partial or no control for confounders such as pre-existing cognitive
    ability and socioeconomic disparity, that fidelity of implementation - particularly
    participant responsiveness - was frequently unreported, that nearly half the studies ran under
    conditions of low ecological validity (researcher-led, isolated one-to-one sessions), and that
    parent-focused interventions were both uncommon and less consistently effective than
    school-based ones. This is the single most important source behind Nova's Transfer state: a
    child who gets better at a trained maths task usually does not, on this evidence, get better
    at maths.
  limits: >-
    Abstract only; full text not read. The author-provided abstract was read in full on the ERIC
    record, but the Springer full text redirected to an authentication endpoint, so the
    per-country breakdown, the list of the 101 interventions, the quality-appraisal detail and the
    review's own discussion and limitations were not seen, and the conduct of the review cannot be
    judged - hence 'emerging' rather than 'moderate', despite how directly the finding bears on
    Nova. This is a descriptive systematic review, not a meta-analysis: it characterises and
    appraises the 101 interventions and reports the proportion with positive outcomes, but it pools
    no effect sizes, so "over 90% positive" is a vote count and is vulnerable to publication bias -
    a point the review's own catalogue of methodological weakness reinforces. The 25 countries are not
    named in the abstract and no statement is made about Arabic-speaking children or about digital
    delivery, so nothing is claimed for either.

- id: ev.math.nrc-2009
  title: "Mathematics Learning in Early Childhood: Paths Toward Excellence and Equity"
  citation: "National Research Council (2009). Committee on Early Childhood Mathematics; Cross, C. T., Woods, T. A., & Schweingruber, H. (Eds.). Washington, DC: The National Academies Press. ISBN 978-0-309-12806-3, 398 pp. Number core and teaching-learning paths, chapter 5, pp. 129-130 and Box 5-2."
  url: https://nap.nationalacademies.org/catalog/12519/mathematics-learning-in-early-childhood-paths-toward-excellence-and-equity
  verified: true
  evidence_type: developmental_framework
  evidence_strength: moderate
  population: children from about age 2 through kindergarten; a committee synthesis of the research literature, not a study of a sample
  delivery: mixed
  language: en
  finding: >-
    The committee sets out four aspects of the "number core" - cardinality, the number word list,
    1-to-1 counting correspondences, and written number symbols - and states that they are
    initially separate and must be connected. On the ordering Nova had been assuming, the report
    is explicit: children "first connect saying the number word list with 1-to-1 correspondences
    to begin counting objects. Initially this counting is just an activity without an
    understanding of the total amount (cardinality). If asked the question How many are there?
    after counting, children may count again (repeatedly) or give a number word different from the
    last counted word. Connecting counting and cardinality is a milestone in children's numerical
    learning path". It also states that one-to-one counting correspondence means "each object is
    paired with exactly one number word", and it places both in Step 1 of the number core
    (ages 2-3), with later 2- and 3-year-olds coordinating the components "to count n things and,
    later, say the number counted". This is the source that replaces Nova's design inference for
    the counting ordering: one-to-one correspondence in counting precedes the understanding that
    the last word counted is the total.
  limits: >-
    This is a consensus committee synthesis, not a primary study and not a meta-analysis: it
    reports no pooled effect size and does not establish the ordering experimentally, and its
    teaching-learning paths are explicitly described as approximate, age-indexed steps, not as an
    invariant sequence every child follows. It supports the ordering but not Nova's ages: the
    report puts all four number-core components, one-to-one counting correspondences among them,
    and their coordination "to count n things and, later, say the number counted" inside Step 1,
    "ages 2 and 3", with Step 2 at age 4 extending them to larger numbers. Nova's `age_range` of
    [3, 4] for one-to-one correspondence and [4, 5] for cardinality is therefore Nova's own
    judgment, set later than the NRC's steps, and must not be attributed to this source. It is a US report about US early-childhood education,
    written in English, and the report itself notes that number-word structure differs across
    languages; nothing in it addresses Arabic number words or Arabic-speaking children, and
    nothing in it addresses digital delivery - the paths it describes are for adults working with
    children, with objects. It therefore supports the ordering of Nova's two counting skills; it
    supports no claim that a tablet game teaches them.
# Added 2026-09-27 (research rule): the sources behind Make Ten and Number Path. Each was checked
# against its publisher record and abstract (Crossref / OpenAlex).
- id: ev.math.murata-2004
  title: 'Paths to learning ten-structured understandings of teen sums: addition solution methods of Japanese Grade 1 students'
  citation: Murata, A. (2004). Cognition and Instruction, 22(2), 185-218. doi:10.1207/s1532690xci2202_2
  url: https://doi.org/10.1207/s1532690xci2202_2
  verified: true
  research_origin: [JP]
  evidence_type: program_evidence
  evidence_strength: emerging
  population: Japanese Grade 1 students (about 6-7 years) followed over one school year in a classroom
  delivery: teacher_led
  language: ja
  finding: >-
    Children moved through the levels of quantity conception described in US and European research,
    by varied individual paths, and "gradually came to use the culturally valued break-apart-to-make-ten
    method", with counting and visual grouping supporting the process; the classroom instruction that
    supported this conceptual structure is described.
  limits: >-
    A descriptive classroom study of one Japanese first grade, not a controlled trial. Nova takes from it
    the Japanese sequence -- the parts of ten first (いくつといくつ), then teen sums by making ten -- not an
    effect size.
- id: ev.math.kullberg-2020
  title: Effects of learning addition and subtraction in preschool by making the first ten numbers and their relations visible with finger patterns
  citation: Kullberg, A., Björklund, C., Brkovic, I., & Runesson Kempe, U. (2020). Educational Studies in Mathematics, 103(2), 157-172. doi:10.1007/s10649-019-09927-1
  url: https://doi.org/10.1007/s10649-019-09927-1
  verified: true
  research_origin: [SE]
  evidence_type: quasi_experimental
  evidence_strength: moderate
  population: 103 five-year-olds in Swedish preschools (intervention 65, control 38)
  delivery: teacher_led
  language: sv
  finding: >-
    An 8-month programme making the part-part-whole relations of the numbers to ten visible (with
    finger patterns) raised arithmetic outcomes significantly above the control group, the difference
    remained a year later, and children "learned to recognize and use part-part-whole relations in novel
    arithmetic tasks".
  limits: Teacher-led programme with finger patterns, not an app; groups were not randomised.
- id: ev.math.siegler-ramani-2008
  title: "Playing linear numerical board games promotes low-income children's numerical development"
  citation: Siegler, R. S., & Ramani, G. B. (2008). Developmental Science, 11(5), 655-661. doi:10.1111/j.1467-7687.2008.00714.x
  url: https://doi.org/10.1111/j.1467-7687.2008.00714.x
  verified: true
  research_origin: [US]
  evidence_type: rct
  evidence_strength: moderate
  population: preschoolers from low-income and middle-income families, USA
  delivery: mixed
  language: en
  finding: >-
    Playing a simple linear numerical board game for four 15-minute sessions eliminated the gap in
    numerical estimation between low-income and more affluent preschoolers; the same game with colours
    instead of numbers had no such effect.
  limits: Small samples and short sessions with an adult; a physical board game, not an app.
- id: ev.math.ramani-siegler-2008
  title: "Promoting broad and stable improvements in low-income children's numerical knowledge through playing number board games"
  citation: Ramani, G. B., & Siegler, R. S. (2008). Child Development, 79(2), 375-394. doi:10.1111/j.1467-8624.2007.01131.x
  url: https://doi.org/10.1111/j.1467-8624.2007.01131.x
  verified: true
  research_origin: [US]
  evidence_type: rct
  evidence_strength: moderate
  population: low-income preschoolers (mean age 5.4 years), USA
  delivery: mixed
  language: en
  finding: >-
    About an hour of playing a linear number board game improved magnitude comparison, number line
    estimation, counting and numeral identification, with gains still present 9 weeks later; an
    identical game with coloured squares did not. Home experience with number board games correlated
    with numerical knowledge.
  limits: A physical game played with an adult who had the child say each number while moving; Nova's
    screen version keeps the linear path and the counting aloud but has not itself been tested.
- id: ev.math.urakami-sugimura-2017
  title: 'Is numerical estimation in young children based on numerical representations? (幼児における数の位置の見積りは数量表象に基づいているのか？)'
  citation: Urakami, M., & Sugimura, S. (2017). Journal of Science Education in Japan (科学教育研究), 41(3), 295-302.
  url: https://www.jstage.jst.go.jp/article/jssej/41/3/41_295/_article/-char/ja/
  verified: true
  research_origin: [JP]
  evidence_type: developmental_framework
  evidence_strength: emerging
  population: 59 children in a private day nursery in Hiroshima (19 aged about 5;5, 40 aged about 6;3)
  delivery: not_applicable
  language: ja
  finding: >-
    On a 0-20 number-to-position task, preschoolers' estimates reflected a mental representation of a
    specific unit -- a developing mental number line -- even when they counted along the line with a
    finger; the representation shaped where they placed numbers.
  limits: >-
    A small experimental study of how preschoolers place numbers on a line, not of a game that teaches
    it. Nova cites it for why a linear, numbered path suits this age, alongside the board-game trials.
- id: ev.math.murata-2008
  title: 'Mathematics teaching and learning as a mediating process: the case of tape diagrams'
  citation: Murata, A. (2008). Mathematical Thinking and Learning, 10(4), 374-406. doi:10.1080/10986060802291642
  url: https://doi.org/10.1080/10986060802291642
  verified: true
  research_origin: [JP]
  evidence_type: program_evidence
  evidence_strength: emerging
  population: Japanese elementary mathematics classrooms and curriculum (grades 1-6)
  delivery: teacher_led
  language: ja
  finding: >-
    The tape diagram (テープ図) is "a central visual representation used in Japanese mathematics
    curriculum"; used consistently and coherently over the grades, one representation "can bridge
    student understanding over time, focusing on mathematical relationships and problem-solving
    processes" -- from adding and taking away in story problems onward.
  limits: >-
    An analysis of curriculum and classroom practice, not a controlled trial. Nova takes the
    representation (parts and whole drawn as lengths of one tape) for its story problems, not an
    effect size.
