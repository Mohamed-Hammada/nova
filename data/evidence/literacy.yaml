# Early literacy: English, and Arabic.
#
# Nova runs Arabic and English as separate tracks, and the evidence behind them is not
# comparable. The English entries rest on large, well-known meta-analyses. The Arabic entries
# are fewer, smaller and mostly not of a type this spec's closed list handles well; see
# docs/curriculum/research-log.md, "Sources that need a spec change", and read the limits on
# each Arabic entry before citing it.
#
# Nothing in the English entries is assumed to carry over to Arabic. Where an English source
# says something directly relevant to that question - and the National Reading Panel does - it
# is recorded in that source's own limits.
#
# Every entry here was checked by opening the URL recorded on it.

# ---------------------------------------------------------------------------
# English early literacy, and phonological awareness
# ---------------------------------------------------------------------------

- id: ev.literacy.nelp-2008
  title: "Developing Early Literacy: Report of the National Early Literacy Panel. A Scientific Synthesis of Early Literacy Development and Implications for Intervention"
  citation: National Early Literacy Panel (2008). Washington, DC. National Institute for Literacy / National Center for Family Literacy. Predictor correlations, chapter 2; code-focused intervention effects, chapter 3 and Table 3.1.
  url: https://www.nichd.nih.gov/sites/default/files/publications/pubs/documents/NELPReport09.pdf
  verified: true
  evidence_type: meta_analysis
  evidence_strength: moderate
  population: children from birth to age 5 and kindergarteners; about 500 research articles screened from more than 8,000, across correlational studies of predictors and experimental/quasi-experimental studies of instruction (code-focused n = 78, shared reading n = 19, parent and home n = 32, preschool/kindergarten programmes n = 33, language enhancement n = 28)
  delivery: mixed
  language: en
  finding: >-
    Two results matter to Nova. First, on what predicts later reading: six variables had "medium to
    large predictive relationships with later measures of literacy development" and kept their
    predictive power after IQ and SES were accounted for - alphabet knowledge, phonological
    awareness, rapid automatic naming of letters or digits, rapid automatic naming of objects or
    colours, writing or writing one's name, and phonological memory. The pooled correlations with
    later decoding were: alphabet knowledge r = 0.50 (52 studies, 7,570 children), writing/writing
    name r = 0.49 (10 studies, 1,650 children), phonological awareness r = 0.40 (69 studies, 8,443
    children), rapid naming of letters/digits r = 0.40 (12 studies, 2,081), oral language r = 0.33
    (63 studies, 9,358) and concepts about print r = 0.34 (12 studies, 2,604). Alphabet knowledge
    and writing were significantly stronger predictors of decoding than phonological awareness was,
    and phonological awareness was in turn stronger than concepts about print or oral language.
    Second, on what instruction does: code-focused interventions had "significant and moderate to
    large effects across a broad spectrum of early literacy outcomes", and "the largest impact of
    code-focused interventions was on PA, with an average ES of 0.82". This is the source behind
    Nova's choice of alphabet knowledge, phonological awareness and name-writing as English
    literacy skills, and behind the ordering that puts letter knowledge at least as early as
    phonological awareness.
  limits: >-
    These are correlations among predictors, not causes: a child who scores higher on phonological
    awareness at four tends to decode better later, which does not by itself show that raising
    phonological awareness raises decoding - the intervention meta-analyses are the separate
    evidence for that, and they were mostly not run on the same children. The panel searched only
    studies "published in refereed journals in the English language", so nothing here speaks to
    Arabic-speaking children or to an Arabic orthography; the phonological-awareness result in
    particular depends on the relation between a language's sounds and its script and cannot be
    carried across. The panel notes that most code-focused interventions were delivered
    individually or in small groups, or the studies did not say, so "it is not possible, on the
    basis of these analyses, to determine the effectiveness of whole-class or large-group
    code-focused instruction with young children" - and still less of unattended tablet play. The
    panel found significant heterogeneity in most of the predictor correlations. The report is from
    2008 and its database is older than that.

- id: ev.literacy.nrp-phonemic-awareness-2000
  title: "Report of the National Reading Panel: Teaching Children to Read. Chapter 2, Part I: Phonemic Awareness Instruction"
  citation: National Reading Panel (2000). Teaching Children to Read - Reports of the Subgroups. NIH Pub. No. 00-4754. Washington, DC. National Institute of Child Health and Human Development. Chapter 2, Part I, pp. 2-1 to 2-6. The meta-analysis was also published as Ehri et al. (2001), Reading Research Quarterly, 36(3), 250-287.
  url: https://www.nichd.nih.gov/sites/default/files/publications/pubs/nrp/Documents/report.pdf
  verified: true
  evidence_type: meta_analysis
  evidence_strength: moderate
  population: preschool through 6th grade, from 1,962 screened articles; 52 articles yielding 96 treatment-control comparisons of phonemic-awareness instruction against another form of instruction or regular classroom instruction
  delivery: mixed
  language: en
  finding: >-
    Teaching children to manipulate phonemes in spoken words works, and its benefit reaches
    reading. "The overall effect size on PA outcomes was large, 0.86. The overall effect size on
    reading outcomes was moderate, 0.53. The overall effect on spelling was also moderate, 0.59."
    Effects were still significant on follow-up tests several months after training ended, and on
    standardised as well as experimenter-devised tests. Several moderators bear directly on Nova's
    design: effect sizes "were larger when children received focused and explicit instruction on
    one or two PA skills than when they were taught a combination of three or more"; teaching
    phoneme manipulation with letters beat teaching it in speech alone; small groups beat
    individual or whole-class instruction; treatments of 5 to 18 hours beat both shorter and longer
    ones; "Classroom teachers were very effective in teaching PA to children. Also, computers were
    effective"; and "Students in the lower grades, preschool, and kindergarten, showed larger
    effect sizes in acquiring PA than children in 1st grade and above". The panel also reports a
    clean negative control that is worth keeping: "Effects of training did not generalize to
    performance on math tests, indicating that halo/Hawthorne effects did not account for the
    findings" - which is also a reminder that a literacy gain is a literacy gain and nothing more.
  limits: >-
    Directly relevant to Nova's English track and no further. The panel states plainly that
    "Children learning to read in English showed larger effects than children learning to read in
    other alphabetic languages", both for acquiring phonemic awareness and for transfer to reading,
    which is exactly the reason Nova may not assume this result for Arabic. Although computer
    formats were effective, the panel adds that in classroom-teacher and computer studies "the
    degree of transfer was less than that achieved in experimentally controlled studies" - real
    settings produced smaller effects than research settings, and Nova is a real setting with even
    less adult supervision than either. Effects were small or null in places: for low-achieving
    readers in grades 2-6 the effect on reading did not differ from chance, and the effect on
    spelling for disabled readers was not significantly different from zero. The database is from
    2000 or earlier and was screened only for English-language refereed journals; the panel did not
    conduct a formal publication-bias analysis, and its conclusions have been contested in later
    re-analyses that Nova has not read.

- id: ev.literacy.nrp-phonics-2000
  title: "Report of the National Reading Panel: Teaching Children to Read. Chapter 2, Part II: Phonics Instruction"
  citation: National Reading Panel (2000). Teaching Children to Read - Reports of the Subgroups. NIH Pub. No. 00-4754. Washington, DC. National Institute of Child Health and Human Development. Chapter 2, Part II, pp. 2-89 to 2-100.
  url: https://www.nichd.nih.gov/sites/default/files/publications/pubs/nrp/Documents/ch2-II.pdf
  verified: true
  evidence_type: meta_analysis
  evidence_strength: moderate
  population: children from kindergarten to 6th grade; 38 studies yielding 66 treatment-control comparisons of systematic phonics instruction against unsystematic or no phonics instruction
  delivery: teacher_led
  language: en
  finding: >-
    "The mean overall effect size produced by phonics instruction was moderate in size and
    statistically greater than zero, d = 0.44." The age pattern is the part Nova needs: "Phonics
    instruction taught early proved much more effective than phonics instruction introduced after
    first grade. Mean effect sizes were kindergarten d = 0.56; first grade d = 0.54; 2nd through
    6th grades d = 0.27." For children at risk the early effects were larger still - d = 0.58 for
    at-risk kindergarteners and d = 0.74 for at-risk first-graders. The panel also states that
    "To be effective, systematic phonics instruction introduced in kindergarten must be
    appropriately designed for learners and must begin with foundational knowledge involving
    letters and phonemic awareness", which is the ordering Nova's English track uses: letters and
    phonemic awareness first, then letter-sound decoding.
  limits: >-
    This is about English, whose alphabetic code is what "phonics" means here; the result says
    nothing about Arabic, whose orthography represents consonants and long vowels with short vowels
    written as optional diacritics, and Nova does not carry it across. The effect is moderate, not
    transformative, and it is not uniform: phonics failed to help low-achieving readers in grades
    2-6 (d = 0.15, not statistically greater than chance, from only eight comparisons in three
    studies) and helped diagnosed disabled readers only modestly (d = 0.32). Almost all of this
    instruction was delivered by a person - tutoring d = 0.57, small group d = 0.43, whole class
    d = 0.39 - and none of it establishes that a tablet can substitute. The database closed in 2000
    and shares the age and publication-bias caveats recorded on the phonemic-awareness entry.

- id: ev.literacy.cusiter-2025
  title: "Combined Language and Code Emergent Literacy Intervention for At-Risk Preschool Children: A Systematic Meta-Analytic Review"
  citation: Cusiter, J., Short, K., Webb, A., & Munro, N. (2025). Child Development, 96(4), 1519-1545. doi:10.1111/cdev.14252
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12208012/
  verified: true
  evidence_type: meta_analysis
  evidence_strength: moderate
  population: 29 randomised controlled trials published before March 2023, reporting 43 interventions with 9,333 children aged 4-6 years who were at risk - either identified with a speech and/or language disorder or at risk of literacy failure on socioeconomic or academic grounds (55% male; 45% African American, 30% Hispanic, 20% White, 5% other); 25 of the 29 studies were conducted in the USA, with one each from Israel, Australia, Canada and Costa Rica
  delivery: teacher_led
  language: en
  finding: >-
    This is the source the original brief cited for "a small overall effect on phonological
    awareness", and it does contain such an effect, though the paper is about something wider:
    interventions that combine language work (vocabulary, grammar, morphology, inferencing) with
    code work (phonological awareness, letter knowledge, print concepts) for at-risk preschoolers.
    The composite effects were small - language g = 0.11 [0.03, 0.18] and code g = 0.23 [0.15,
    0.31] - and the phonological-awareness-specific pooled effect was "small (g = 0.32, 95% CI
    [0.18, 0.45], p < 0.01)" from 46 effect sizes across 21 studies, with substantial heterogeneity
    (I-squared = 71%). Within phonological awareness the subgroups split sharply: composite
    phonological-awareness measures moved almost not at all (g = 0.08), while the specific,
    trainable skills moved a little - blending and elision g = 0.26, first-sound identification and
    alliteration g = 0.24. Language subskills behaved the same way: proximal vocabulary, the words
    actually taught, g = 0.53, against distal (standardised) vocabulary g = 0.08. Interventions
    that gave code and language equal emphasis did at least as well on both as those weighted to
    one. For Nova this is a caution, not an endorsement: these programmes move the narrow skill
    that was trained, and barely move the broad measure.
  limits: >-
    The overall effects are small, the heterogeneity is high (I-squared = 71%, still 64% after
    removing the five studies flagged as possible sources of publication bias), and the authors
    themselves report that publication bias was detected. The population is at-risk 4-6 year olds,
    overwhelmingly in the USA, and the review could not separate children with a diagnosed speech
    or language disorder from children at risk on socioeconomic grounds, so the effects cannot be
    attributed to either group. Delivery was almost entirely human: 39 of 43 interventions were
    preschool-based and 32 were delivered by a preschool educator, with only 2 of 43 delivered by a
    computer, so this is not evidence about software. The authors flag variable dosage reporting
    and variable reporting of intervention targets as threats to their own coding. Nothing here is
    about Arabic or about children learning to read in a language other than English (aside from
    single studies in Israel and Costa Rica, whose results are not reported separately). The gap
    between proximal g = 0.53 and distal g = 0.08 vocabulary, and between specific
    phonological-awareness skills and the phonological-awareness composite, is the same
    near-transfer-only pattern that ev.math.munez-2026 reports for mathematics.

# ---------------------------------------------------------------------------
# Arabic early literacy
#
# Read this before citing anything below. Arabic early-literacy research is small, recent and
# heavily concentrated in one population - Palestinian-Arabic-speaking children in Israel - and
# most of it is observational. Only one of the three entries below is an intervention study.
# Several important Arabic sources could not be recorded at all because the spec's closed type
# list has no slot for a single observational study; they are named in
# docs/curriculum/research-log.md. Nova's Arabic track therefore rests substantially on judgment
# and on framework evidence, and the spec says so rather than implying parity with English.
# ---------------------------------------------------------------------------

- id: ev.literacy.haj-2026
  title: "Investigating the role of Arabic diglossia-centered multi-domain intervention (ADMIN) in enhancing Palestinian-Arabic speaking kindergarten children's emergent literacy"
  citation: "Haj, L., Schiff, R., Ghawi-Dakwar, O., & Saiegh-Haddad, E. (2026). Reading and Writing (advance online publication; received 28 May 2025, accepted 14 January 2026). doi:10.1007/s11145-026-10766-9. Open access, CC BY 4.0. A published Correction exists: doi:10.1007/s11145-026-10905-2, read in full."
  url: https://link.springer.com/content/pdf/10.1007/s11145-026-10766-9.pdf
  verified: true
  evidence_type: rct
  evidence_strength: emerging
  population: 403 monolingual Palestinian-Arabic-speaking kindergarten children in Israel (189 boys, 214 girls), aged 57-70 months (M = 64.4, SD = 3.1), from mid-to-low SES kindergartens, with no reported hearing or vision impairment and no diagnosed developmental disability; 250 in the experimental group across 50 classrooms and 153 controls across 13 classrooms
  delivery: teacher_led
  language: ar
  finding: >-
    A cluster-randomised trial of a diglossia-centred kindergarten programme, and the best
    intervention evidence Nova has for Arabic. Randomisation was at the kindergarten level.
    Kindergarten teachers, after a 30-hour training course and with weekly in-class modelling and
    fidelity checks, delivered 45 sessions of 20 minutes, three a week for 15 weeks, in small
    groups of five; controls got business-as-usual instruction from the standard preschool
    curriculum. The programme's ordering is the part Nova can use directly. It trains structures
    that are identical in Spoken and Standard Arabic first and moves to Standard-Arabic-specific
    structures later; it trains syllable-level phonological awareness in weeks 1-3 and only
    reaches phoneme-level awareness in week 8; and it introduces letters in a deliberate sequence -
    first four letters that represent spoken phonemes and share a basic shape while differing only
    in dots, then a diglossic letter with its spoken phonetic neighbour, each pair presented
    together, with auditory discrimination of confusable phonemes built in. Multilevel models for
    the nested data found significant time-by-group interactions favouring the experimental group
    on every Spoken-Arabic and Standard-Arabic language and metalinguistic measure (receptive and
    expressive vocabulary, lexico-phonological representations, phonological awareness,
    morphological awareness), on letter-name and letter-sound knowledge, and on all three
    executive-function components.
  limits: >-
    A published Correction to this article exists (doi:10.1007/s11145-026-10905-2) and was read in
    full. It is minor and does not change the conclusions: two reference placeholders were
    resolved, one asterisk was added to a significance marker in Table 4, and two control-group
    effect-size ranges were corrected downward - "(d = 0.20 to d = 0.81)" to "(d = 0.20 to
    d = 0.65)" and "(d = 0.26 to d = 0.86)" to "(d = 0.26 to d = 0.75)". The PDF read for this
    entry is the corrected version and carries the corrected values, so the numbers below are
    post-correction. That a peer-reviewed article needed two of its reported effect-size ranges
    corrected is, however, part of why this entry is rated 'emerging' rather than 'moderate'; the
    other part is that the full text is the only source for every claim here and no independent
    replication exists.
    The control group improved too, and substantially: within-group pre-post effect sizes for
    controls ran d = 0.20 to 0.65 on Spoken Arabic tasks, d = 0.26 to 0.75 on Standard Arabic
    metalinguistic and lexical tasks and d = 0.78 to 0.86 on letter knowledge, against d = 0.65 to
    1.69, d = 0.56 to 1.44 and d = 1.50 to 1.52 respectively for the experimental group. The value
    added by the programme is therefore the interaction term, and no standardised between-group
    effect size appears in the results text or the tables that were read; the raw
    experimental-group d values must not be read as the programme's effect. On randomisation, the
    paper states that "Children were randomly allocated to two groups" and that "Randomization was
    conducted at the kindergarten level, with each kindergarten assigned to either experimental or
    control condition", so the type `rct` is supported by an explicit statement - but the paper
    does not say how the five children per experimental kindergarten were selected from within
    each classroom, and that within-cluster selection is unexplained. The allocation was also
    unbalanced in a way that matters - 50 experimental classrooms of five children each against 13
    control classrooms of 5 to 16 - which is many clusters on one side and few on the other. The authors' own limitations
    are that outcomes are immediate post-intervention only, with no follow-up into primary school;
    that children's informal home language and literacy background was not modelled; and that the
    sample is Palestinian-Arabic speakers in Israel, so "generalization to other Arabic-speaking
    contexts requires consideration of cultural, regional, and sociolinguistic variability that may
    moderate intervention effects" - which directly limits its use for Gulf, Egyptian or other
    Levantine varieties. Delivery was by trained human teachers in small groups with weekly expert
    support; nothing here shows a tablet can do this, and the programme is multi-domain, so no
    single component's contribution can be separated out.

- id: ev.literacy.asadi-2026
  title: "Diglossia and Orthographic Complexity as Multiplicative but not Additive Challenges in Arabic: A Critical Review"
  citation: Asadi, I., & Asli-Badarneh, A. (2026). Journal of Psycholinguistic Research, 55(3), 37. doi:10.1007/s10936-026-10214-3
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13050341/
  verified: true
  evidence_type: systematic_review
  evidence_strength: emerging
  population: monolingual first-language Arabic speakers; a PRISMA-guided search of PubMed Central, PsycINFO, ERIC, LLBA, Web of Science, Frontiers and Google Scholar for empirical studies published January 2000 to July 2025, yielding 92 unique records, 38 full texts examined and 29 studies included; the included studies run from kindergarten to about Grade 6
  delivery: not_applicable
  language: ar
  finding: >-
    The one synthesis Nova found that covers all four of the Arabic features its literacy track has
    to design around. On letter forms - "With 28 consonantal phonemes but over 100 allographic
    forms, children must learn that multiple shapes correspond to the same sound", many letters
    differ only by dots, and "Visual-orthographic errors - mainly letter-shape confusions and
    faulty ligaturing - made up over a quarter of mistakes in Grades 1-4, second only to
    phonological errors". On diacritics - vowelization "is essential early on" and its benefit
    declines with age, while "For skilled readers, diacritics hinder speed and accuracy"; the move
    from fully vowelized to unvowelized print is a developmental juncture, not a formatting choice.
    On phonological awareness - "Kindergarten and first-grade pupils struggled with StA-specific
    phonemes, a gap persisting through Grade 6". On diglossia - "Corpus studies show that only 21%
    of Palestinian Arabic words are identical across varieties", and the review's central claim is
    that diglossia and orthographic complexity interact multiplicatively rather than additively.
    Together these are the reasons Nova runs Arabic as a separate track with its own progression,
    teaches positional letter forms explicitly, treats diacritics as a staged support to be faded,
    and does not reuse the English phonological-awareness sequence.
  limits: >-
    The authors title it "A Critical Review" and it pools no effect sizes. It is recorded as
    systematic_review because its method section states that it followed PRISMA and reports a
    reproducible search and screening count, but it is a narrative synthesis and nothing in it is
    a pooled estimate. It includes only 29 studies, and the authors note that "Most evidence comes
    from controlled tasks using isolated words or pseudowords, which clarify specific processes but
    lack ecological validity", that "Longitudinal data are also missing", and that "research is
    concentrated in a few national and dialectal settings" - in practice largely Palestinian Arabic
    in Israel. Most of the included evidence is from school-age children, not from the 3-6 year
    olds Nova targets, and the vowelization findings it cites (Abu-Rabia and Hijjazi) come from
    Grades 5-9, well outside Nova's range; Nova therefore treats "vowelize early, fade later" as a
    direction, not a calibrated rule. Nothing in the review concerns digital delivery.

- id: ev.literacy.taha-thomure-2025
  title: A systematic review of teaching and learning in the context of Arabic diglossia
  citation: "Taha Thomure, H., Taha, H., Sabella, T., & Saleh, R. (2025). Social Sciences & Humanities Open, 12, 102281. doi:10.1016/j.ssaho.2025.102281. A corrigendum was published as doi:10.1016/j.ssaho.2026.102681."
  url: https://doi.org/10.1016/j.ssaho.2025.102281
  verified: true
  evidence_type: systematic_review
  evidence_strength: emerging
  population: teaching and learning in Arabic diglossic contexts; a PRISMA search of eight education and social-science databases plus grey literature covering 1970-2021, screening 927 Arabic and English records and including 101 studies
  delivery: teacher_led
  language: ar
  finding: >-
    A PRISMA systematic review of the educational, rather than psycholinguistic, side of Arabic
    diglossia. Its descriptive synthesis identifies five recurring themes across the 101 included
    studies: diglossic distance, the achievement gap, prestige and attitudes, policy, and exposure
    to Standard Arabic including parental engagement. Its recommendations include "integrating
    simplified standard Arabic in early childhood education", applying evidence-based methods in
    teacher training, and "expanding home-based exposure to Standard Arabic through accessible,
    engaging resources", and it concludes by highlighting "the need for research to develop and
    evaluate pedagogical approaches suited to diglossic contexts". Nova records it for two
    reasons: it independently corroborates that diglossic distance is the organising problem of
    early Arabic literacy, and its closing sentence is the honest statement of where this field
    stands - the pedagogy has largely not been evaluated.
  limits: >-
    Abstract only; full text not read. The published abstract was read and confirmed identically on
    the DOAJ record and on the Crossref and OpenAlex records; ScienceDirect returned HTTP 403, so
    the 101 included studies, the screening flow and the authors' own limitations were not seen,
    nothing beyond the abstract is recorded, and the conduct of the review cannot be judged. It is a descriptive synthesis with no pooled effect sizes and no quality
    appraisal visible in the abstract, and it includes grey literature, so the evidence base behind
    the five themes is of unknown and probably mixed quality. Its search stops at 2021. A
    corrigendum exists and its content was not read; the published abstract also carries an
    uncorrected production artefact (a raw bibliography key, bib_meiseles_1980, in its second
    sentence), which is a small sign of loose editorial handling. Its recommendations are
    recommendations, not tested interventions.
