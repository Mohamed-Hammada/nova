# Written with the Nova authoring helper, then maintained by hand. Every entry here is judgment-class
# (design inference) until the research task links verified evidence.
- id: task.lit.en.retell
  name_key: task.lit.en.retell.name
  age_range: [2, 5]
  skills: [lit.en.listening]
  mechanic_id: retell
  description: After a short picture book read aloud, the child retells what happened to an adult, in order.
  signals: [accuracy, adult_assist, error_type]
  scoring: The adult marks whether the main events were told and in order.
- id: task.lit.en.find-what-i-name
  name_key: task.lit.en.find-what-i-name.name
  age_range: [2, 5]
  skills: [lit.en.vocabulary]
  mechanic_id: physical-hunt
  description: The adult names an everyday thing in the room; the child finds it and brings or points to it.
  signals: [accuracy, adult_assist, error_type]
  scoring: The adult marks each find correct or not.
- id: task.lit.en.sound-games
  name_key: task.lit.en.sound-games.name
  age_range: [3, 6]
  skills: [lit.en.syllables, lit.en.rhyme, lit.en.first-sounds]
  mechanic_id: oral-sound-game
  description: "Adult-led spoken games with no screen: clap the syllables of names, say words that rhyme, play I spy with the first sound."
  signals: [accuracy, adult_assist, error_type]
  scoring: The adult marks each answer correct or not.
- id: task.lit.en.book-hunt
  name_key: task.lit.en.book-hunt.name
  age_range: [3, 6]
  skills: [lit.en.print-direction, lit.en.letter-case]
  mechanic_id: print-hunt
  description: With a real book, the child shows where to start reading and finds a letter the adult names.
  signals: [accuracy, adult_assist, error_type]
  scoring: The adult marks each answer correct or not.
