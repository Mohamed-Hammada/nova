# Journeys: the level map for each age group. Each level plays one game (or, for literacy, the game for the
# child's language). Inside a level the Adaptive Engine still chooses the rung; a level never sets difficulty.
# skin only changes the pictured objects in counting games.
#
# Stages divide each journey into adventures of ten levels. All the stages, in age order, form ONE continuous
# journey: a child's age picks the stage they START at (the first stage whose age_range includes their age), and
# finishing a stage's required levels unlocks the next -- the journey moves on, the child's age never changes.
# role: required (needed to finish the stage; the default), practice, challenge, optional or review.
# prerequisites: levels (earlier in the same journey) that must be finished before this one opens.
